name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm install --prefix "$RUNNER_TEMP/dsh-rc2" --no-audit --no-fund @deepseek-ai/dsh@0.1.7-rc.2
      - run: npm run test:install -- "$RUNNER_TEMP/dsh-rc2"
